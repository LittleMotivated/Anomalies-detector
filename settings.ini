[Paths]
data_dir = data/
graphics_dir = graphics/
output_dir = output/
stocks_file = data/stocks.csv
prices_file = data/daily_prices.csv

[Interface]
font_family = Segoe UI
font_size = 10
bg_color = #FFFFFF
fg_color = #202020
window_width = 1280
window_height = 800
default_candles_n = 60

[Detector]
default_method = zscore
default_window = 24
min_volume = 1000.0

[Detector.ZScore]
sensitivity_low = 3.0
sensitivity_medium = 2.5
sensitivity_high = 2.0
manual_sigma =

[Detector.IQR]
sensitivity_low = 3.0
sensitivity_medium = 1.5
sensitivity_high = 1.0

[Detector.VolumePrice]
price_sigma_low = 3.0
price_sigma_medium = 2.5
price_sigma_high = 2.0
volume_mult_low = 3.0
volume_mult_medium = 2.0
volume_mult_high = 1.5

[Markers]
anomaly_color = #E53935
normal_color = #2E7D32
volume_bar_color = #607D8B
marker_size = 80
